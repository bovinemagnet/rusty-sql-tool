[package]
name = "rusty-sql-tool"
version = "0.0.0"
edition = "2024"
authors = ["Paul Snow"]
description = "A fast, native, editor-first PostgreSQL client"
license = "MIT"

[lib]
name = "rusty_sql_tool"
path = "src/lib.rs"

[[bin]]
name = "rusty-sql-tool"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
chrono = "0.4.45"
gpui = "0.2.2"
rustls = "0.23.42"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "native-certs"] }
url = "2.5.8"
uuid = "1.24.0"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[profile.release]
lto = "thin"
strip = true
